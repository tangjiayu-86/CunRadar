# ═══════════════════════════════════════════════════════════════
#                    CunRadar 配置文件 — AI 日报
# ═══════════════════════════════════════════════════════════════

# 基础设置
app:
  timezone: "Asia/Shanghai"
  max_item_age_hours: 24       # 每日更新视角

# ─── 关注列表 ─────────────────────────────────────────────────
follow:

  # YouTube AI 频道（用 @handle 自动解析）
  youtube:
    - name: "Two Minute Papers"
      handle: "@TwoMinutePapers"
    - name: "Yannic Kilcher"
      handle: "@YannicKilcher"
    - name: "AI Explained"
      handle: "@aiexplained-official"

  # B站 AI UP 主
  bilibili:
    - name: "跟李沐学AI"
      uid: 1567748478
    - name: "秋叶aaaki"
      uid: 12566101

  # RSS 博客 / 新闻（中文科技源）
  rss:
    - name: "机器之心"
      url: "https://www.jiqizhixin.com/rss"
    - name: "量子位"
      url: "https://www.qbitai.com/feed"
    - name: "36氪"
      url: "https://36kr.com/feed"

  # GitHub 项目追踪
  github:
    - name: "LangChain"
      repo: "langchain-ai/langchain"
    - name: "AutoGPT"
      repo: "Significant-Gravitas/AutoGPT"
    - name: "Ollama"
      repo: "ollama/ollama"

  # GitHub Trending 每日热门
  github_trending:
    enabled: true
    language: ""               # 空 = 所有语言
    limit: 10                  # 前10名

# ─── AI 配置 ───────────────────────────────────────────────────
ai:
  model: "deepseek-chat"
  api_key: "${DEEPSEEK_API_KEY}"
  api_base: "https://api.deepseek.com"
  timeout: 180

# ─── 通知配置 ─────────────────────────────────────────────────
notification:
  telegram:
    bot_token: "${TELEGRAM_BOT_TOKEN}"
    chat_id: "${TELEGRAM_CHAT_ID}"

# ─── 输出配置 ─────────────────────────────────────────────────
output:
  dir: "output"
  html: true
