name: CunRadar Daily

on:
  schedule:
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # 自定义运行时间（UTC 时间）
    #
    #  分钟 小时 日 月 星期
    #   ──  ──  ─ ─ ───
    #  "0   8   * * *"  = 每天 UTC 08:00
    #
    # 北京时间比 UTC 快 8 小时，所以：
    #   UTC 00:00 = 北京 08:00
    #   UTC 16:00 = 北京 00:00（次日）
    #
    # 常用配置：
    #   "0 0 * * *"   每天北京 08:00（默认）
    #   "30 1 * * *"  每天北京 09:30
    #   "0 12 * * *"  每天北京 20:00
    #   "0 0 * * 1-5" 工作日北京 08:00（周末不跑）
    #
    # 只改第一、二个数字（分钟、小时），其余保持 * 不变
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    - cron: "0 0 * * *"    # 北京时间每天 08:00
  workflow_dispatch:

concurrency:
  group: cunradar-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --no-dev

      - name: Restore database from cache
        uses: actions/cache@v4
        id: db-cache
        with:
          path: output/cunradar.db
          key: cunradar-db-v1

      - name: Run CunRadar
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN || github.token }}
          CUNRADAR_PUBLIC_URL: ${{ vars.CUNRADAR_PUBLIC_URL || '' }}
          FOLLOW_CONFIG: ${{ secrets.FOLLOW_CONFIG || vars.FOLLOW_CONFIG || '' }}
        run: uv run python -m cunradar

      - name: Save database to cache
        uses: actions/cache/save@v4
        with:
          path: output/cunradar.db
          key: cunradar-db-v1

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: output
          destination_dir: ${{ github.run_number }}
          keep_files: true
